name: Build and Upload Plugin ZIP
on:
  release:
    types: [published]

jobs:
  build-and-zip:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - personal-notes
          - personal-readwise-sync
          - personal-evernote-sync
          - personal-todo
          - personal-ai-chat
          - personal-stuff

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Build Plugin
      id: build
      uses: ./.github/actions/build-plugin
      with:
        node-version: '20'
        php-version: '8.2'
        composer-no-dev: 'true'
        package-slug: ${{ matrix.package }}

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ${{ github.workspace }}/${{ steps.build.outputs.zip-path }}
        asset_name: ${{ matrix.package }}.zip
        asset_content_type: application/zip
