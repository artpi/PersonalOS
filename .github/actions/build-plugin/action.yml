name: Build PersonalOS Plugin
description: Install dependencies, build assets, and create a split plugin ZIP.
inputs:
  node-version:
    description: Node.js version to use.
    required: false
    default: '20'
  php-version:
    description: PHP version to use.
    required: false
    default: '8.2'
  composer-no-dev:
    description: Whether to install Composer dependencies without dev packages.
    required: false
    default: 'true'
  zip-path:
    description: Expected plugin ZIP path produced by build.
    required: false
    default: ''
  package-slug:
    description: Package slug to zip.
    required: false
    default: ''
outputs:
  zip-path:
    description: Path to the generated plugin ZIP file.
    value: ${{ steps.zip-path.outputs.path }}
runs:
  using: composite
  steps:
    - name: Setup dependencies
      uses: ./.github/actions/setup-deps
      with:
        node-version: ${{ inputs.node-version }}
        php-version: ${{ inputs.php-version }}
        composer-no-dev: ${{ inputs.composer-no-dev }}

    - name: Build plugin assets
      run: npm run build
      shell: bash

    - name: Create plugin ZIP
      run: |
        if [ -n "${{ inputs.package-slug }}" ]; then
          npm run package:plugin -- --package="${{ inputs.package-slug }}"
        else
          npx --yes @wordpress/scripts@30.7.0 plugin-zip
        fi
      shell: bash

    - name: Verify split plugin ZIP
      if: ${{ inputs.package-slug != '' }}
      run: npm run verify:split-packages -- --package="${{ inputs.package-slug }}"
      shell: bash

    - id: zip-path
      run: |
        if [ -n "${{ inputs.zip-path }}" ]; then
          echo "path=${{ inputs.zip-path }}" >> "$GITHUB_OUTPUT"
        elif [ -n "${{ inputs.package-slug }}" ]; then
          echo "path=${{ inputs.package-slug }}.zip" >> "$GITHUB_OUTPUT"
        else
          echo "path=wp-personal-os.zip" >> "$GITHUB_OUTPUT"
        fi
      shell: bash
